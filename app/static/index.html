<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CommerceAI Support Agent</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-soft: #1f2937;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #22c55e;
        --accent-strong: #16a34a;
        --danger: #ef4444;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #020817, #111827 40%, #0f172a);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app {
        width: min(980px, 92vw);
        background: rgba(15, 23, 42, 0.88);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        box-shadow: 0 24px 60px rgba(0,0,0,0.45);
        overflow: hidden;
      }
      .header {
        padding: 1.25rem 1.5rem;
        background: rgba(17, 24, 39, 0.9);
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      }
      .header h1 {
        margin: 0;
        font-size: clamp(1.5rem, 2vw, 2.2rem);
      }
      .header p {
        margin: 0.5rem 0 0;
        color: var(--muted);
      }
      .chat {
        height: 540px;
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 0.35rem 0.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .msg {
        max-width: 80%;
        padding: 0.85rem 1rem;
        border-radius: 14px;
        line-height: 1.5;
      }
      .msg.user {
        align-self: flex-end;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: white;
      }
      .msg.bot {
        align-self: flex-start;
        background: var(--panel-soft);
        color: var(--text);
        border: 1px solid rgba(148, 163, 184, 0.12);
      }
      form {
        display: flex;
        gap: 0.75rem;
      }
      input {
        flex: 1;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(15, 23, 42, 0.8);
        color: var(--text);
        border-radius: 12px;
        font-size: 1rem;
        padding: 0.9rem 1rem;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 0.9rem 1.2rem;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
      .health {
        color: var(--muted);
        font-size: 0.9rem;
        margin-top: 0.5rem;
      }
      @media (max-width: 640px) {
        .msg { max-width: 92%; }
        form { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <h1>CommerceAI Support Agent</h1>
        <p>Track orders, check stock, review payments, and manage returns</p>
      </div>
      <div class="chat">
        <div class="messages" id="messages">
          <div class="msg bot">Hi! I can help you check order status, shipping, stock, and returns.</div>
        </div>
        <form id="chat-form">
          <input id="message" type="text" placeholder="Ask about your order or product..." autocomplete="off" />
          <button type="submit">Send</button>
        </form>
        <div class="health">Service status: <span id="health-status">checking...</span></div>
      </div>
    </div>

    <script>
      const messagesEl = document.getElementById('messages');
      const form = document.getElementById('chat-form');
      const input = document.getElementById('message');
      const healthStatus = document.getElementById('health-status');

      const addMessage = (text, type) => {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      };

      const checkHealth = async () => {
        try {
          const resp = await fetch('/health');
          const data = await resp.json();
          healthStatus.textContent = data.status === 'ok' ? 'Online' : 'Degraded';
        } catch (error) {
          healthStatus.textContent = 'Offline';
        }
      };

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        addMessage(text, 'user');
        input.value = '';
        try {
          const response = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
          });
          const data = await response.json();
          addMessage(data.response, 'bot');
        } catch (error) {
          addMessage('I’m unable to reach the support agent right now.', 'bot');
        }
      });

      checkHealth();
    </script>
  </body>
</html>
